name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install PowerShell (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          brew install --cask powershell
        else
          wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
        fi

    - name: Test Module Import
      shell: pwsh
      run: |
        Import-Module ./pwsh/oh-my-stats.psd1 -ErrorAction Stop
        Get-Module oh-my-stats

    - name: Test Show-SystemStats
      shell: pwsh
      run: |
        Import-Module ./pwsh/oh-my-stats.psd1
        Show-SystemStats -NoModuleStatus

    - name: Test Config Loading
      shell: pwsh
      run: |
        $config = Get-Content ./config/default.json | ConvertFrom-Json
        Write-Host "Config version: $($config.version)"
        if (-not $config.version) { throw "Invalid config" }

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -SkipPublisherCheck

    - name: Run Pester Tests
      shell: pwsh
      run: |
        Invoke-Pester ./tests/pwsh/ -Output Detailed

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          pwsh/**
          config/**
          README.md
          LICENSE
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-powershell-gallery:
    name: Publish to PowerShell Gallery
    needs: release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Stage module for publishing
      shell: pwsh
      run: |
        # The Gallery requires the folder name to match the module name, and an
        # installed module has no ../config - it carries its own copy instead.
        $stage = Join-Path $env:RUNNER_TEMP 'oh-my-stats'
        New-Item -ItemType Directory -Path "$stage/config" -Force | Out-Null
        Copy-Item ./pwsh/oh-my-stats.psd1, ./pwsh/oh-my-stats.psm1 $stage
        Copy-Item ./config/default.json "$stage/config/"
        Copy-Item ./LICENSE, ./README.md $stage
        Import-Module "$stage/oh-my-stats.psd1" -Force -ErrorAction Stop
        Write-Host "Staged oh-my-stats $((Get-Module oh-my-stats).Version)"

    - name: Publish
      shell: pwsh
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        # A job-level `if` cannot read secrets, so the guard lives here. No key
        # configured means the release still succeeds, just without the Gallery.
        if (-not $env:PSGALLERY_API_KEY) {
          Write-Host '::warning::PSGALLERY_API_KEY is not set - skipping the PowerShell Gallery publish.'
          exit 0
        }
        Publish-Module -Path (Join-Path $env:RUNNER_TEMP 'oh-my-stats') `
                       -NuGetApiKey $env:PSGALLERY_API_KEY `
                       -Verbose
